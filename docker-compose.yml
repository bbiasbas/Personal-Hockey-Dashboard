services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hockey
      POSTGRES_PASSWORD: ${PGPASSWORD:-hockey}
      POSTGRES_DB: hockey
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
